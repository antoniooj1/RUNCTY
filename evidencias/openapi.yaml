      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - ILUMINACION
          - OBSTACULO
          - VIA
        description: |-
          * `ILUMINACION` - Iluminación deficiente
          * `OBSTACULO` - Obstáculo en el camino
          * `VIA` - Vía deteriorada
      - in: query
        name: zona
        schema:
          type: integer
