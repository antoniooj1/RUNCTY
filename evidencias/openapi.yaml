  /api/rutas/recomendar/:
    get:
      operationId: rutas_recomendar_list
      description: 'RU-02 y RU-07: hasta 3 rutas de la zona a ±0,5 km, ordenadas por
        índice de seguridad.'
      parameters:
      - in: query
        name: dificultad
        schema:
          type: string
          enum:
          - Alta
          - Baja
          - Media
        description: |-
          * `Baja` - Baja
          * `Media` - Media
          * `Alta` - Alta
      - in: query
