  /api/consentimientos/:
    get:
      operationId: consentimientos_list
      description: Aceptar (POST), consultar y revocar (DELETE) el consentimiento.
        No se edita.
      parameters:
      - in: query
        name: corredor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: version
        schema:
          type: string
      tags:
      - consentimientos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsentimientoList'
          description: ''
    post:
      operationId: consentimientos_create
      description: Aceptar (POST), consultar y revocar (DELETE) el consentimiento.
        No se edita.
      tags:
      - consentimientos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consentimiento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Consentimiento'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Consentimiento'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentimiento'
          description: ''
  /api/consentimientos/{id}/:
    get:
      operationId: consentimientos_retrieve
