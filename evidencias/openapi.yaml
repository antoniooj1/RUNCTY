  /api/reportes/:
    get:
      operationId: reportes_list
      description: 'RU-52: reportes de peligro. La respuesta nunca incluye al autor.'
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - PENDIENTE
        description: '* `PENDIENTE` - Sin confirmar'
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
