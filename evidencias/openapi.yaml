components:
  schemas:
    Consentimiento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        corredor:
          type: integer
        corredor_alias:
          type: string
          readOnly: true
        version:
          type: string
          readOnly: true
        fecha_utc:
          type: string
          format: date-time
          readOnly: true
      required:
      - corredor
      - corredor_alias
      - fecha_utc
      - id
      - version
    Corredor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alias:
          type: string
          maxLength: 60
        consentimiento_vigente:
          type: boolean
          readOnly: true
      required:
      - alias
      - consentimiento_vigente
      - id
    DificultadEnum:
      enum:
      - Baja
      - Media
      - Alta
      type: string
      description: |-
        * `Baja` - Baja
        * `Media` - Media
        * `Alta` - Alta
    EstadoEnum:
      enum:
      - PENDIENTE
      type: string
      description: '* `PENDIENTE` - Sin confirmar'
    EvaluacionRuta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ruta:
          type: integer
          readOnly: true
        ruta_nombre:
          type: string
          readOnly: true
        indice:
          type: integer
          readOnly: true
        hora_salida:
          type: string
          format: time
          readOnly: true
        fecha_utc:
          type: string
          format: date-time
          readOnly: true
        aportes:
          readOnly: true
      required:
      - aportes
      - fecha_utc
      - hora_salida
      - id
      - indice
      - ruta
      - ruta_nombre
    PaginatedConsentimientoList:
      type: object
      required:
